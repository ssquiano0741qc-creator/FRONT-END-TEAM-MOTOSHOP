<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — TeamMotor</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-12">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title">
          <h1>Users</h1>
          <p>Who can log in, and what they can do</p>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div class="search-input" style="max-width:20rem;"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="21" y2="21"/></svg><input type="text" id="userSearch" placeholder="Search users..."></div>
        <div class="actions">
          <button class="btn btn-primary" id="addUserBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add User</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Date Added</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="usersTbody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add / Edit User -->
<div class="modal-overlay" id="userModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="userModalTitle">Add User</h2>
      <button class="modal-close" data-close="userModalOverlay"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="userForm" novalidate>
        <div class="form-grid">
          <div class="field"><label for="uName">Full Name</label><input type="text" id="uName" required maxlength="50"></div>
          <div class="field"><label for="uUsername">Username</label><input type="text" id="uUsername" required maxlength="30" pattern="[a-z0-9.\-]+" data-error-msg="Lowercase letters, numbers, dots or hyphens only." placeholder="e.g. juan.delacruz"></div>
          <div class="field"><label for="uEmail">Email</label><input type="email" id="uEmail" required></div>
          <div class="field">
            <label for="uRole">Role</label>
            <select id="uRole"><option value="Staff">Staff</option><option value="Admin">Admin</option></select>
          </div>
          <div class="field">
            <label for="uPassword">Password</label>
            <input type="password" id="uPassword" maxlength="72" autocomplete="new-password" placeholder="Enter password">
          </div>
          <div class="field">
            <label for="uConfirmPassword">Confirm Password</label>
            <input type="password" id="uConfirmPassword" maxlength="72" autocomplete="new-password" placeholder="Re-enter password">
          </div>
          <div class="field span-2">
            <label for="uStatus">Status</label>
            <select id="uStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
          </div>
        </div>
        <div class="hint" id="userPasswordHint">Password and confirm password are required when adding a new account.</div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="userModalOverlay">Cancel</button>
      <button class="btn btn-primary" id="saveUserBtn">Save User</button>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/store.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/users.js"></script>
</body>
</html>
